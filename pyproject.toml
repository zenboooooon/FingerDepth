[project]
name = "monocular-fingertip-depth"
version = "0.1.0"
description = "Metric3D v2 + MediaPipe fingertip metric-depth PoC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.21,<0.11",
    "mmcv-lite>=2.2.0,<3",
    "mmengine>=0.10.7,<1",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=5,<6",
    "pillow>=11,<13",
    "pillow-heif>=1.8.0",
    "timm>=1.0.15,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[project.scripts]
fingertip-depth = "fingertip_depth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
unidepth = [
    "einops>=0.7,<1",
    "huggingface-hub>=0.27,<2",
    "numpy>=2,<3",
    "safetensors>=0.4,<1",
    "scipy>=1.13,<2",
    "wandb>=0.19,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingertip_depth"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"


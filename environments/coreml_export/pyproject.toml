[project]
name = "fingertip-depth-coreml-export"
version = "0.1.0"
description = "Pinned uv environment for exporting fingertip-depth students to Core ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools==9.0",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11,<13",
    "timm==1.0.20",
    "torch==2.7.0",
    "torchvision==0.22.0",
]

[tool.uv]
package = false

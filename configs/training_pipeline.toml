# Paths are resolved from the repository root.
[input]
train_dir = "data/training_videos/train"
validation_dir = "data/training_videos/validation"
extensions = [".mov", ".mp4", ".m4v"]

# This is the current iPhone-video approximation, not a calibrated camera value.
# Add a video_overrides entry below when the actual 35 mm-equivalent focal length is known.
default_focal_35mm_mm = 36.0

[output]
processed_dir = "outputs/training_pipeline/processed"
dataset_dir = "outputs/training_pipeline/dataset"
runs_dir = "outputs/training_pipeline/runs"

# Example per-video override. The key is a project-root-relative path.
# [video_overrides."data/training_videos/train/example.mov"]
# focal_35mm_mm = 26.0

[prepare]
hand_model_path = "assets/hand_landmarker.task"
landmark_indices = [5, 6, 7, 8]
frame_transfer_mode = "hardlink"
# max_frames = 100  # Smoke tests only; omit for complete datasets.

[teacher]
depth_pro_project = "environments/depth_pro"
device = "cuda:0"
frame_transfer_mode = "hardlink"
checkpoint_interval_frames = 100
# max_frames = 100
# Model-selection reports are video-specific and deliberately not reused by this pipeline.
# A configured legacy report is accepted only to emit an ignored warning.

[dataset]
frame_transfer_mode = "hardlink"
# Keep validation sequence-held-out. Do not set validation_tail_fraction for the
# normal train/validation directory workflow.
# validation_tail_fraction = 0.07

[training]
device = "cuda:0"

[training.model]
image_encoder_name = "vit_small_patch16_224.dino"
pretrained_image_encoder = true
landmark_indices = [5, 6, 7, 8]
fusion_layers = 2
fusion_heads = 6
fusion_mlp_ratio = 4.0
dropout = 0.1

[training.optimizer]
epochs = 40
batch_size = 32
encoder_learning_rate = 1e-5
head_learning_rate = 1e-4
weight_decay = 0.05
warmup_fraction = 0.05
gradient_clip_norm = 1.0
early_stopping_patience = 12
image_size = 224
image_mean = [0.485, 0.456, 0.406]
image_std = [0.229, 0.224, 0.225]
num_workers = 4
seed = 20260925
precision = "bfloat16"
freeze_image_encoder = false
preload_images = true
verify_image_png_sha256 = true

[training.spike_filter]
enabled = true
frame_radius = 3
max_frame_gap = 1
min_neighbors = 3
absolute_floor_m = 0.15
relative_floor_fraction = 0.50
mad_multiplier = 6.0
mad_scale = 1.4826
max_depth_m = 0.8
